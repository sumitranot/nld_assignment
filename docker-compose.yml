version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nld_postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: nld_user
      POSTGRES_PASSWORD: nld_password
      POSTGRES_DB: nld_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nld_user -d nld_db']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:16-alpine
    container_name: nld_postgres_test
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: nld_user
      POSTGRES_PASSWORD: nld_password
      POSTGRES_DB: nld_db_test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nld_user -d nld_db_test']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

